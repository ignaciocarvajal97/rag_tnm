- id: public-joins-dim-by-fact-id
  title: Patrón canónico de cruces — todas las dimensiones por fact_servicios.id
  schema: public
  kind: join_model
  domain: servicios
  content: |
    **Regla canónica del DW TNM (validada con la herramienta BI/ETL):** todas las dimensiones del
    esquema `public` se cruzan con `public.fact_servicios` usando **el mismo surrogate**:

    ```
    dim.id_<dim> = public.fact_servicios.id
    ```

    Es decir, el ETL alinea **fila a fila** el `id` de `fact_servicios` con la PK de cada dimensión,
    no por las `fk_*`. Las columnas `fk_*` de `fact_servicios` (`fk_servicio`, `fk_etapa`,
    `fk_caracteristicas`, etc.) **no** son las llaves de unión a las dimensiones en este DW; son
    referencias al id operativo del servicio en origen y se usan para conteos/filtros, no para JOIN.

    Joins canónicos (siempre `LEFT JOIN` salvo que el filtro requiera presencia obligatoria):

    ```sql
    FROM public.fact_servicios fs
    LEFT JOIN public.etapa                e  ON e.id_etapa             = fs.id
    LEFT JOIN public.caracteristicas      c  ON c.id_caracteristicas   = fs.id
    LEFT JOIN public.cliente_facturacion  cf ON cf.id_customer         = fs.id
    LEFT JOIN public.cliente_despacho     cd ON cd.id_cliente_despacho = fs.id
    LEFT JOIN public.comercial            co ON co.id_comercial        = fs.id
    LEFT JOIN public.conductor            cn ON cn.id_conductor        = fs.id
    LEFT JOIN public.nave                 n  ON n.id_nave              = fs.id
    LEFT JOIN public.time                 t  ON t.id_time              = fs.id
    -- agencia, direccion_salida, direccion_llegada, real_time_*: mismo patrón id_<dim> = fs.id
    ```

    **Identidad de servicio para conteos:** usar `fs.fk_servicio` (id operativo en origen).
    `COUNT(DISTINCT fs.fk_servicio)` cuenta servicios distintos. Para fechas usar `t.etapa_1_fecha`
    de `public.time`.

    **Tipo de etapa** (almacenaje/retiro/presentación/devolución): filtrar `e.codigo` como texto
    (`'0'`, `'1'`, `'2'`, `'3'`). Catálogo `04_public_modelo_etapas` para la lista.

    **Tipo de servicio comercial / IMPO / EXPO / importación / exportación / «tipos de servicios»:**
    filtrar o agrupar por **`c.impo_expo`** desde `public.caracteristicas` (con el JOIN canónico de
    arriba `c.id_caracteristicas = fs.id`). **No** uses `etapa.codigo` para esto.

- id: public-ejemplos-conteos-mensuales
  title: Ejemplos canónicos de SQL (mes calendario)
  schema: public
  kind: examples
  domain: servicios
  content: |
    Ventana mensual obligatoria en PostgreSQL (sin TIMESTAMPTZ con nombre de zona):
    `fecha >= DATE 'YYYY-MM-01' AND fecha < DATE 'YYYY-(MM+1)-01'`.

    **Servicios distintos por etapa (ej. presentación) en abril 2026:**

    ```sql
    SELECT COUNT(DISTINCT fs.fk_servicio) AS servicios_abril_2026
    FROM public.fact_servicios fs
    LEFT JOIN public.etapa e ON e.id_etapa = fs.id
    LEFT JOIN public.time  t ON t.id_time  = fs.id
    WHERE e.codigo = '2'
      AND t.etapa_1_fecha >= DATE '2026-04-01'
      AND t.etapa_1_fecha <  DATE '2026-05-01';
    ```

    **Servicios por tipo de servicio (IMPO/EXPO/...) en abril 2026:**

    ```sql
    SELECT TRIM(c.impo_expo) AS tipo_servicio,
           COUNT(DISTINCT fs.fk_servicio) AS cantidad
    FROM public.fact_servicios fs
    LEFT JOIN public.caracteristicas c ON c.id_caracteristicas = fs.id
    LEFT JOIN public.time            t ON t.id_time            = fs.id
    WHERE t.etapa_1_fecha >= DATE '2026-04-01'
      AND t.etapa_1_fecha <  DATE '2026-05-01'
    GROUP BY TRIM(c.impo_expo)
    ORDER BY cantidad DESC;
    ```

    **Servicios IMPO en abril 2026 con etapa de presentación:**

    ```sql
    SELECT COUNT(DISTINCT fs.fk_servicio) AS impo_abril_2026
    FROM public.fact_servicios fs
    LEFT JOIN public.caracteristicas c ON c.id_caracteristicas = fs.id
    LEFT JOIN public.etapa           e ON e.id_etapa           = fs.id
    LEFT JOIN public.time            t ON t.id_time            = fs.id
    WHERE TRIM(c.impo_expo) = 'IMPO'
      AND e.codigo = '2'
      AND t.etapa_1_fecha >= DATE '2026-04-01'
      AND t.etapa_1_fecha <  DATE '2026-05-01';
    ```

- id: tabla-fact-servicios-recall
  title: Tabla fact_servicios (recuerdo de grano)
  schema: public
  kind: table
  domain: servicios
  content: |
    `public.fact_servicios` es el hecho central. Granularidad: una fila por carga del ETL; su `id`
    se reutiliza como PK alineada en cada dimensión (`etapa.id_etapa`, `caracteristicas.id_caracteristicas`,
    `time.id_time`, `cliente_facturacion.id_customer`, `cliente_despacho.id_cliente_despacho`,
    `comercial.id_comercial`, `conductor.id_conductor`, `nave.id_nave`, …). Por eso el patrón canónico
    de JOIN es **`dim.id_<dim> = fact_servicios.id`**. Las columnas `fk_*` del hecho identifican el
    servicio operativo y otras referencias en origen (no son las llaves físicas a dimensiones).

    - `public.etapa` (PK=id_etapa, 17 columnas)
    - `public.fact_servicios` (PK=id, 21 columnas)
    - `public.facturas` (PK=id_factura, 9 columnas)
    - `public.nave` (PK=id_nave, 4 columnas)
    - `public.real_time_arribo` (PK=id_real_time, 3 columnas)
